{% extends 'layout.html' %}


{% block page %}
  <div class="row q-my-lg" :class="{'q-mt-xl': $q.screen.gt.sm}">
    <div class="col-3 col-md-2"></div>
    <div class="col-9 col-md-10">
      <div class="row q-col-gutter-x-xl">
        <div class="col-12 col-md-5 q-pr-xl">
          <h5 class="q-mt-none q-mb-md">Not this time</h5>
          <p>You are not authorized to view the page you are trying to open. Please <a href="mailto:{{ CONTACT_EMAIL }}">contact us</a> if you believe you are seeing this page incorrectly and should have access to the resource you are looking for.</p>
          <p class="text-grey">403 Forbidden</p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
