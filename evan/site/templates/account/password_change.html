{% extends 'users/base.html' %}


{% block head_title %}Change Password - Settings - {{ block.super }}{% endblock %}

{% block content %}
    <h4 class="display-sm mb-4">Change password</h4>

    <form method="post" action="{% url 'account_change_password' %}">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="btn btn-primary mt-2">Change password</button>
    </form>
{% endblock %}
