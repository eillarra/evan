<script type="text/x-template" id="v-abstract">
{% verbatim %}
  <div v-if="event && event.config.abstracts && obj" class="row q-col-gutter-lg items-stretch">

    <div class="col-12 col-md-8">
      <q-card flat class="q-pa-lg full-height">
        <display-5>Abstract submission</display-5>
        <marked v-if="event.custom_data.abstracts.help" :text="event.custom_data.abstracts.help" />

        <div class="q-mt-lg q-gutter-md">
          <q-input filled dense v-model="obj.title" label="Title *" />
          <q-input filled dense v-model="obj.authors" label="Authors *" autogrow />
          <q-input filled dense v-model="obj.abstract" type="textarea" label="Short abstract *" :rules="(event.custom_data.abstracts.abstract_max_length) ? [txt => txt.length <= event.custom_data.abstracts.abstract_max_length || 'Please use maximum ' + event.custom_data.abstracts.abstract_max_length + ' characters'] : null" />
          <evan-custom-fieldsets v-model="obj" :fieldsets="fieldsets" :event="event" />
        </div>

        <div class="q-mt-xl">
          <q-btn unelevated @click.prevent="createOrUpdate(obj)" :disable="!formIsValid" :color="(formIsValid) ? 'primary' : 'orange'" :label="(obj.self) ? 'Update abstract information' : 'Submit abstract'"></q-btn>
          <p class="q-mt-md text-orange" v-show="!formIsValid">
            <i class="material-icons q-mr-sm">block</i>
            <strong>Please fill in mandatory fields.</strong>
          </p>
        </div>

      </q-card>
    </div>

    <div v-if="event.config.abstracts.uploader" class="col-12 col-md-4 q-gutter-lg">
      <q-card v-if="obj.self" flat class="q-pa-lg">
        <display-5>Files</display-5>
        <evan-file-list :files="obj.files" />
        <div class="rounded-borders" v-show="obj.files.length < event.config.abstracts.uploader.max_files">
          <q-uploader ref="uploader" flat auto-upload :factory="uploaderFactory" :accept="event.config.abstracts.uploader.accept" :max-files="maxFiles" :max-file-size="maxFileSize" @failed="uploadFailed" @rejected="uploadRejected" @uploaded="uploaded" :label="event.config.abstracts.uploader.label" color="primary" class="full-width bg-grey-2" />
        </div>
      </q-card>
      <q-card v-else flat class="q-pa-lg">
        <display-5>Files</display-5>
        <display-3>Please submit your abstract information before uploading a PDF file.</display-3>
      </q-card>
      <q-card v-if="templateUrl" flat class="q-pa-lg">
        <q-list>
          <q-item clickable tag="a" :href="templateUrl" target="_blank" rel="noopener">
            <q-item-section avatar>
              <q-avatar color="orange" text-color="white" icon="description" />
            </q-item-section>
            <q-item-section><small>You can download the abstract template here.</small></q-item-section>
          </q-item>
        </q-list>
      </q-card>
    </div>

  </div>
{% endverbatim %}
</script>
