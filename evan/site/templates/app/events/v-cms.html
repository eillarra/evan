<script type="text/x-template" id="v-cms">
{% verbatim %}
  <div v-if="event && event.config.cms">

    <q-card flat class="q-pa-lg">
      <div class="row no-wrap q-mb-sm">
        <display-5>Content management</display-5>
        <q-space />
        <div v-if="event.website">
          <q-btn type="a" :href="event.website" target="_blank" rel="noopener" no-caps outline rounded color="primary" label="Open website" />
        </div>
      </div>
      <q-table dense row-key="key" :rows="contents" :columns="table.columns" :pagination="table.pagination" @row-click="function (e, row) { cloneObj(row) }">
        <template v-slot:no-data="{ icon, message, filter }">
          <evan-no-data :message="message" :filter="filter" />
        </template>
        <template v-slot:body-cell-edit="props">
          <q-td auto-width :props="props">
            <evan-edit-icon />
          </q-td>
        </template>
      </q-table>
    </q-card>

    <evan-editor size="lg" :obj="tmpObj" :save-event-name="saveEventName">
      <div class="q-gutter-md">
        <q-input filled dense v-model="tmpObj.key" readonly label="Key"></q-input>
        <evan-markdown v-if="tmpObj.marked" v-model="tmpObj.value" label="Content"></evan-markdown>
        <q-input v-else filled dense v-model="tmpObj.value" label="Content" type="textarea" autogrow></q-input>
      </div>
    </evan-editor>

  </div>
{% endverbatim %}
</script>
