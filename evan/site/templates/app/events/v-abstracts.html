<script type="text/x-template" id="v-abstracts">
{% verbatim %}
  <div v-if="event && event.config.abstracts">

    <q-card flat class="q-pa-lg">
      <div class="row no-wrap q-mb-sm">
        <display-5>Paper abstracts</display-5>
        <q-space />
        <div>
          <q-btn no-caps outline rounded type="a" href="{% endverbatim %}{% url 'event:abstracts_sheet' event.code %}{% verbatim %}" color="primary" label="Download overview" target="_blank" rel="noopener"></q-btn>
        </div>
      </div>
      <evan-search-bar v-model="query" placeholder="Search by ID, author, title..." :filters="filters" />
      <q-table :dense="$q.screen.gt.sm" row-key="uuid" :rows="abstracts || []" :columns="table.columns" :pagination="table.pagination" :filter="query" :filter-method="customFilter" @row-click="function (e, row) { cloneObj(row) }">
        <template v-slot:no-data="{ icon, message, filter }">
          <evan-no-data :message="message" :filter="filter" />
        </template>
        <template v-slot:body-cell-view="props">
          <q-td auto-width :props="props">
            <q-icon name="visibility" color="primary" />
          </q-td>
        </template>
        <template v-slot:body-cell-title="props">
          <q-td :props="props">
            <div class="ellipsis" style="min-width:200px; max-width:22vw">{{ props.row.title }}</div>
          </q-td>
        </template>
        <template v-slot:body-cell-created_at="props">
          <q-td auto-width :props="props">{{ props.row.date }}</q-td>
        </template>
        <template v-slot:body-cell-reviewers="props">
          <q-td auto-width :props="props">
            <q-icon name="circle" :color="(props.row.reviewers == 0) ? 'red' : ((props.row.reviewers == event.custom_data.abstracts.max_reviewers) ? 'positive' : 'orange')" class="q-mr-xs" />
            <span>{{ props.row.reviewers }} / {{ event.custom_data.abstracts.max_reviewers }}</span>
          </q-td>
        </template>
        <template v-slot:body-cell-score="props">
          <q-td auto-width :props="props">
            <q-icon :name="(props.row.reviewers > 0 && props.row.reviews_with_score.length == props.row.reviewers) ? 'done_all' : 'warning_amber'" :color="(props.row.reviews_with_score.length  == 0) ? 'red' : ((props.row.reviews_with_score.length == props.row.reviewers) ? 'positive' : 'orange')" class="q-mr-xs" />
            <span><span v-if="props.row.score">{{ props.row.score }}</span><span v-else>-</span> / {{ event.custom_data.abstracts.review_criteria.length * 5 }} ({{ props.row.reviews_with_score.length }})</span>
          </q-td>
        </template>
        <template v-slot:body-cell-is_accepted="props">
          <q-td auto-width :props="props" class="items-center">
            <evan-yes-chip v-if="props.row.is_accepted" />
            <evan-no-chip v-else />
          </q-td>
        </template>
      </q-table>

      <evan-editor size="lg" position="standard" :obj="obj">

        <template v-slot:header>
          <q-tabs v-model="tmpTab" align="left" active-color="primary" indicator-color="primary" class="text-grey-6 q-pt-md q-pl-lg">
              <q-tab name="main" label="Overview" />
              <q-tab name="abstract" label="Abstract" />
              <q-tab name="reviews" label="Reviews" />
          </q-tabs>
          <q-separator></q-separator>
        </template>

        <q-list dense>
          <q-item>
            <q-item-section avatar><q-icon name="title" /></q-item-section>
            <q-item-section>
              <q-item-label class="ellipsis">{{ obj.title }}</q-item-label>
            </q-item-section>
          </q-item>
          <q-separator inset="item"></q-separator>
          <q-item>
            <q-item-section avatar><q-icon :name="(obj.is_accepted) ? 'check_circle_outline' : 'help_outline'" /></q-item-section>
            <q-item-section>
              <q-item-label>Status: <strong v-if="obj.is_accepted" class="text-positive">accepted</strong>
                <strong v-else>not accepted</strong></q-item-label>
            </q-item-section>
          </q-item>
          <q-separator inset="item"></q-separator>
          <q-item>
            <q-item-section avatar><q-icon name="label_important_outline" /></q-item-section>
            <q-item-section>
              <q-item-label><q-badge v-for="tag in obj._tags" rounded outline color="dark" class="q-mr-sm">{{ tag }}</q-badge></q-item-label>
            </q-item-section>
          </q-item>
          <q-separator inset="item"></q-separator>
        </q-list>

        <q-tab-panels v-model="tmpTab">

          <q-tab-panel name="main" class="q-pa-none">
            <q-list dense>
              <q-item>
                <q-item-section avatar><q-icon name="tag" /></q-item-section>
                <q-item-section><samp>{{ obj.uuid }}</samp></q-item-section>
              </q-item>
              <q-separator inset="item"></q-separator>
              <q-item>
                <q-item-section avatar><q-icon name="schedule" /></q-item-section>
                <q-item-section>{{ obj.date }}</q-item-section>
              </q-item>
              <q-separator inset="item"></q-separator>
              <q-item>
                <q-item-section avatar><q-icon name="accessibility_new" /></q-item-section>
                <q-item-section><strong>{{ obj.user_name }}</strong></q-item-section>
                <q-item-section side v-if="obj.user.profile.custom_data.gender">
                  <q-icon :name="obj.user.profile.custom_data.gender" size="14px" />
                </q-item-section>
              </q-item>
              <q-separator inset="item"></q-separator>
              <q-item>
                <q-item-section avatar><q-icon name="mail_outline" /></q-item-section>
                <q-item-section>{{ obj.user.email }}</q-item-section>
                <q-item-section side>
                  <evan-copy-icon :text="obj.user.email" size="14px" />
                </q-item-section>
              </q-item>
              <q-separator inset="item"></q-separator>
              <q-item>
                <q-item-section avatar><q-icon name="business" /></q-item-section>
                <q-item-section>{{ obj.user_affiliation }}</q-item-section>
              </q-item>
              <q-separator v-if="obj.user.profile.country" inset="item" />
              <q-item v-if="obj.user.profile.country">
                <q-item-section avatar>
                  <country-flag :code="obj.user.profile.country.code"></country-flag>
                </q-item-section>
                <q-item-section>{{ obj.user.profile.country.name }}</q-item-section>
              </q-item>
            </q-list>
          </q-tab-panel>

          <q-tab-panel name="abstract" class="q-pa-none">
            <q-list dense>
              <template v-for="file in obj.files">
                <q-item>
                  <q-item-section avatar><q-icon name="attachment" /></q-item-section>
                  <q-item-section class="ellipsis"><a :href="file.url" target="_blank" rel="noopener" class="inherit">{{ file.url }}</a></q-item-section>
                  <q-item-section side>
                    <evan-copy-icon :text="file.url" size="14px" />
                  </q-item-section>
                </q-item>
                <q-separator inset="item"></q-separator>
              </template>
              <q-item class="q-mb-md">
                <q-item-section avatar><q-icon name="notes" /></q-item-section>
                <q-item-section class="q-pt-md">
                  <p class="text-serif text-body2 q-mb-xs"><em>{{ obj.title }}</em></p>
                  <p class="text-serif text-sm q-mb-md">{{ obj.authors }}</p>
                  <marked :text="obj.abstract" class="text-caption" />
                </q-item-section>
              </q-item>
            </q-list>
          </q-tab-panel>

          <q-tab-panel name="reviews" class="q-pa-none">
            <q-list dense>
              <q-item class="q-my-sm">
                <q-item-section avatar top><q-icon name="how_to_reg" class="q-mt-sm" /></q-item-section>
                <q-item-section>
                  <q-select dense filled counter v-model="reviewers" :options="filteredReviewers" option-value="id" option-label="name" emit-value map-options hint="Reviewers" multiple use-chips :max-values="event.custom_data.abstracts.max_reviewers">
                    <template v-slot:selected-item="scope">
                      <q-chip
                        removable
                        dense
                        @remove="scope.removeAtIndex(scope.index)"
                        :tabindex="scope.tabindex"
                        class="q-ma-none q-mr-sm"
                      >
                        <q-avatar :color="(reviewerIdsWithScore.indexOf(scope.opt.id) > -1) ? 'positive' : 'orange'" text-color="white" :icon="(reviewerIdsWithScore.indexOf(scope.opt.id) > -1) ? 'check' : 'priority_high'" />
                        <span class="q-px-xs">{{ scope.opt.name }}</span>
                      </q-chip>
                    </template>
                  </q-select>
                </q-item-section>
              </q-item>
              <template v-for="review in reviews">
                <q-separator inset="item"></q-separator>
                <q-item class="q-mb-md">
                  <q-item-section avatar class="q-pt-sm">
                    <q-icon v-if="!review.ratings.length" name="error_outline"></q-icon>
                    <q-icon v-else name="chat_bubble_outline" />
                  </q-item-section>
                  <q-item-section class="q-pt-md">
                    <strong class="q-mr-lg">{{review.reviewer_name }}</strong>
                    <div class="q-gutter-xs q-mt-sm">
                      <q-chip v-for="rating in review.ratings" size="sm">
                        <q-avatar :color="'blue-' + ((rating[1] * 2) - 1)" text-color="white">{{ rating[1] }}</q-avatar>
                        <span>{{ rating[0] }}</span>
                      </q-chip>
                    </div>
                    <div v-if="review.evaluation">
                      <h6 class="q-my-md text-grey-8 text-underline">Internal evaluation</h6>
                      <marked :text="review.evaluation" class="text-caption q-mt-md" />
                    </div>
                    <div v-if="review.comments">
                      <h6 class="q-my-md text-grey-8 text-underline">General comments</h6>
                      <marked v-if="review.comments" :text="review.comments" class="text-caption q-mt-md" />
                    </div>
                  </q-item-section>
                </q-item>
              </template>
            </q-list>
          </q-tab-panel>

        </q-tab-panels>

        <template v-slot:buttons>
          <q-btn unelevated v-show="tmpTab == 'reviews'" @click="saveReviewers(obj.id)" label="Update reviewers" color="primary" class="q-px-md" />
          <q-btn @click="toggleStatus(obj)" unelevated :label="(obj.is_accepted) ? 'Reset status' : 'Accept'" :color="(obj.is_accepted) ? 'grey-8' : 'primary'" class="q-px-md" />
        </template>
      </evan-editor>

    </q-card>

  </div>
{% endverbatim %}
</script>
