<script type="text/x-template" id="v-events">
{% verbatim %}
  <div>

    <q-card flat class="q-pa-lg">
      <display-5>Event management</display-5>
      <q-input filled dense v-model="query" placeholder="Search by code, name..." type="search" class="q-mb-md">
        <template v-slot:prepend>
          <q-icon name="search" />
        </template>
        <template v-slot:append>
          <q-icon v-if="query !== ''" name="close" @click="query = ''" class="cursor-pointer" />
        </template>
      </q-input>
      <q-table dense row-key="code" :rows="events" :columns="table.columns" :pagination="table.pagination" :filter="query" @row-click="openUrl">
        <template v-slot:no-data="{ icon, message, filter }">
          <evan-no-data :message="message" :filter="filter"></evan-no-data>
        </template>
        <template v-slot:body-cell-href="props">
          <q-td auto-width>
            <q-icon name="outbond" color="primary"></q-icon>
          </q-td>
        </template>
        <template v-slot:body-cell-code="props">
          <q-td auto-width :props="props">
            <samp><small>{{ props.row.code }}</small></samp>
          </q-td>
        </template>
      </q-table>
    </q-card>

  </div>
{% endverbatim %}
</script>
