        <div v-for="fee in fees" class="custom-control custom-radio my-1">
          <q-radio v-model="obj.fee_type" :val="fee.type" :label="fee.notes + ' (' + fee.value + ' EUR)'"></q-radio>
        </div>

              </div>
            </div>
            <div v-else>
              <div v-for="session in regularSessions" :key="session.id" class="custom-control custom-checkbox my-1">

          <div v-if="feeIncludesSocialEvents">

              <label class="custom-control-label" :for="'session' + session.id">{{ session.title }} ({{ session.date }}) </label>&nbsp;<router-link :to="{name: 'session', params: {sessionId: session.id}}">[+]</router-link>
            </div>
            <h6 class="q-mb-sm">Accompanying persons<small v-if="event.social_event_bundle_fee > 0" class="text-info d-block mt-1">Accompanying persons can attend the social event(s) for an extra fee of <strong>{{ event.social_event_bundle_fee }} EUR</strong> per person.</small></h6>
            <p v-if="!obj.accompanying_persons.length" class="text-sm">

          </div>

        <div v-if="obj.fee_type">
          <evan-custom-fieldsets v-model="obj" :fieldsets="fieldsets" />
        </div>

        <div class="q-mt-xl">
          <q-btn unelevated @click.prevent="createOrUpdate(obj)" :disabled="!formIsValid" :color="(formIsValid) ? 'primary' : 'orange'" :label="(obj.self) ? 'Update registration' : 'Create registration'"></q-btn>
          <p class="q-mt-md text-orange" v-show="!formIsValid">
            <i class="material-icons q-mr-sm">block</i>
            <span v-if="feeIsOneDay && obj.days.length > 1">You can only attend one of the days of the event.</span>
            <strong v-else>Please select a fee and fill in mandatory fields.</strong>
          </p>
        </div>

      </q-card>
    </div>


    <div v-if="obj.self" class="col-12 col-md-3 col-lg-4">

      <q-list class="bg-grey-3 rounded-borders q-py-md q-px-sm">
        <q-item>
          <q-item-section>
            <q-item-label>Registration ID</q-item-label>
            <q-item-label caption>{{ obj.uuid }}</q-item-label>
          </q-item-section>
        </q-item>
        <q-item>
          <q-item-section>
            <q-item-label>Last updated</q-item-label>
            <q-item-label caption>{{ obj.updated_at }}</q-item-label>
          </q-item-section>
        </q-item>
        <q-item>
          <q-item-section>
            <q-item-label>Total fee</q-item-label>
            <q-item-label caption>{{ obj.base_fee }} EUR <span v-if="obj.extra_fees">+ {{ obj.extra_fees }} EUR</span></q-item-label>
          </q-item-section>
          <q-item-section side top class="q-mt-sm">
            <q-badge v-if="obj.isPaid" label="PAID" color="primary"></q-badge>
            <q-badge v-else label="PENDING" color="dark"></q-badge>
          </q-item-section>
        </q-item>
        <q-item>
          <q-item-section>
            <q-btn v-if="obj.isPaid" outline icon="info" color="primary" label="View payment info" class="full-width" type="a" :href="obj.payment_url"></q-btn>
            <span v-else>
              <q-btn v-if="!obj.invoice_requested" outline icon="credit_card" color="green" label="Proceed with payment" class="full-width" type="a" :href="obj.payment_url"></q-btn>
              <q-btn v-else disabled outline icon="info" color="dark" label="Invoice is being prepared" class="full-width"></q-btn>
            </span>
          </q-item-section>
        </q-item>
      </q-list>

    </div>

  </div>
{% endverbatim %}
</script>
